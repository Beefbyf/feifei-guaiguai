<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞飞与乖乖的恋爱宇宙</title>
    
    <!-- iOS WebApp Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="恋爱宇宙">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/heart-suit.png">

    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js for 3D Heart Cosmos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FAF7F2',
                        cardBg: '#FFFDF9',
                        pinkWarm: '#FFEDE8',
                        pinkAccent: '#FF7B9C',
                        pinkDeep: '#E85D75'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Quicksand:wght@500;700&display=swap');
        body {
            font-family: 'Quicksand', 'Noto Serif SC', sans-serif;
            background-color: #FAF7F2;
            color: #4A403A;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .glass-card {
            background: #FFFDF9;
            border: 1px solid rgba(255, 123, 156, 0.15);
            box-shadow: 0 10px 30px -10px rgba(232, 93, 117, 0.08);
            border-radius: 1.5rem;
        }
        .heart-beat {
            animation: heartBeat 1.2s infinite ease-in-out;
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }
        .float-animation {
            animation: floating 4s ease-in-out infinite;
        }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        /* Canvas for 3D cosmos */
        #cosmos-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal.active {
            display: flex;
        }
    </style>
</head>
<body class="pb-24">

    <!-- 3D Background Cosmos -->
    <canvas id="cosmos-canvas"></canvas>

    <!-- Header Banner -->
    <header class="pt-8 pb-4 px-6 text-center">
        <div class="inline-flex items-center gap-3 px-5 py-2.5 glass-card rounded-full shadow-sm float-animation">
            <button id="love-btn" class="w-10 h-10 rounded-full bg-pinkWarm flex items-center justify-center text-pinkAccent shadow-inner cursor-pointer active:scale-95 transition">
                <i class="fa-solid fa-heart text-lg heart-beat"></i>
            </button>
            <span class="text-lg font-bold tracking-wider text-gray-800">飞飞与乖乖</span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-5 space-y-6">

        <!-- Countdown Section -->
        <section class="glass-card p-5 relative overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold tracking-widest text-pinkAccent uppercase">Countdown</span>
                    <h2 class="text-base font-bold text-gray-800">下一个小期待</h2>
                </div>
                <button onclick="openModal('countdown-modal')" class="text-xs bg-pinkWarm text-pinkAccent px-3 py-1.5 rounded-full font-medium hover:bg-pink-100 transition">
                    <i class="fa-solid fa-plus mr-1"></i>新增倒计时
                </button>
            </div>
            <div id="countdown-list" class="space-y-3">
                <!-- Dynamic countdown items -->
            </div>
        </section>

        <!-- Habits & Todo Grid -->
        <div class="grid grid-cols-1 gap-5">
            
            <!-- Daily Habits -->
            <section class="glass-card p-5">
                <div class="flex justify-between items-center mb-3">
                    <div>
                        <span class="text-xs font-bold tracking-widest text-pinkAccent uppercase">Daily Habits</span>
                        <h2 class="text-base font-bold text-gray-800">习惯打卡</h2>
                    </div>
                    <button onclick="openModal('habit-modal')" class="text-xs bg-pinkWarm text-pinkAccent px-2.5 py-1 rounded-full font-medium">
                        <i class="fa-solid fa-plus"></i> 新增
                    </button>
                </div>
                <div class="flex items-center justify-between mb-3 bg-pinkWarm/50 px-3 py-1.5 rounded-xl">
                    <span id="habit-progress-text" class="text-xs font-semibold text-pinkDeep">0 / 3 完成</span>
                    <div class="w-24 bg-gray-200 h-2 rounded-full overflow-hidden">
                        <div id="habit-bar" class="bg-pinkAccent h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div id="habit-list" class="space-y-2.5">
                    <!-- Dynamic Habits -->
                </div>
            </section>

            <!-- Our Todo -->
            <section class="glass-card p-5">
                <div class="flex justify-between items-center mb-3">
                    <div>
                        <span class="text-xs font-bold tracking-widest text-pinkAccent uppercase">Our Todo</span>
                        <h2 class="text-base font-bold text-gray-800">情侣待办</h2>
                    </div>
                    <button onclick="openModal('todo-modal')" class="text-xs bg-pinkWarm text-pinkAccent px-3 py-1.5 rounded-full font-medium hover:bg-pink-100 transition">
                        <i class="fa-solid fa-plus mr-1"></i>添加新待办
                    </button>
                </div>
                <div id="todo-list" class="space-y-2.5">
                    <!-- Dynamic Todos -->
                </div>
            </section>
        </div>

        <!-- Love Mini Tools -->
        <section class="glass-card p-5">
            <span class="text-xs font-bold tracking-widest text-pinkAccent uppercase block mb-1">Interactive Tools</span>
            <h2 class="text-base font-bold text-gray-800 mb-4">恋爱体验小工具</h2>
            <div class="grid grid-cols-3 gap-3">
                <!-- Memo / Little Manager -->
                <button onclick="openMemoManager()" class="bg-pinkWarm/60 hover:bg-pinkWarm p-3 rounded-2xl text-center transition flex flex-col items-center justify-center gap-1.5">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-pinkAccent shadow-sm text-lg">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">小管家</span>
                </button>
                <!-- Photo Gallery (恋爱日记) -->
                <button onclick="openGallery()" class="bg-pinkWarm/60 hover:bg-pinkWarm p-3 rounded-2xl text-center transition flex flex-col items-center justify-center gap-1.5">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-pinkAccent shadow-sm text-lg">
                        <i class="fa-solid fa-images"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">恋爱日记</span>
                </button>
                <!-- Pets (初一 & 彪彪) -->
                <button onclick="openPetsModal()" class="bg-pinkWarm/60 hover:bg-pinkWarm p-3 rounded-2xl text-center transition flex flex-col items-center justify-center gap-1.5">
                    <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center text-pinkAccent shadow-sm text-lg">
                        <i class="fa-solid fa-cat"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-700">宠物年糕</span>
                </button>
            </div>
        </section>

        <!-- Wishlist & Daily Records -->
        <div class="grid grid-cols-2 gap-4">
            <!-- Wishlist -->
            <section class="glass-card
