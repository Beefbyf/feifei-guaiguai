<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小年和小年对象 的爱情小屋</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/heart-suit.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Firebase SDKs for Realtime Cloud Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF7F2',
            cardBg: '#FFFDF9',
            pinkWarm: '#FFEDE8',
            pinkAccent: '#FF7B9C',
            pinkHover: '#FF5C83',
            yellowWarm: '#FFF6E5',
            greenWarm: '#EBF7EE',
            purpleWarm: '#F5EFFF',
            darkText: '#2D2926',
            subText: '#8C857B'
          },
          boxShadow: { soft: '0 10px 30px -5px rgba(255, 123, 156, 0.12)' }
        }
      }
    }
  </script>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background-color: #FAF7F2; color: #2D2926;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
    }
    .safe-area-container {
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      min-height: 100dvh;
    }
    #webgl-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none; opacity: 0.5;
    }
    .content-layer { position: relative; z-index: 10; }
    .glass-card {
      background: rgba(255, 253, 249, 0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 123, 156, 0.15);
      box-shadow: 0 10px 30px -5px rgba(255, 123, 156, 0.12);
      border-radius: 1.5rem;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; color: #8C857B; transition: all 0.2s; cursor: pointer;
    }
    .nav-btn.active { color: #FF7B9C; font-weight: bold; }
    .nav-btn.active i { transform: scale(1.15); }
    .burst-heart {
      position: fixed; pointer-events: none; z-index: 9999;
      animation: floatUpFade 1.5s ease-out forwards;
    }
    @keyframes floatUpFade {
      0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 1; }
      50% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot)); opacity: 0.9; }
      100% { transform: translate(calc(-50% + var(--dx) * 1.5), calc(-50% - 100px)) scale(1.8) rotate(var(--rot)); opacity: 0; }
    }
    .modal-backdrop { background: rgba(45, 41, 38, 0.45); backdrop-filter: blur(8px); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #FF7B9C; border-radius: 4px; }
  </style>
</head>
<body class="antialiased pb-20">

  <canvas id="webgl-bg"></canvas>

  <div class="content-layer safe-area-container max-w-md mx-auto space-y-4">

    <!-- 顶部固定栏 (复刻图中的情侣头像与标题) -->
    <header class="glass-card rounded-2xl p-3 flex items-center justify-between sticky top-3 z-40">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-pinkWarm flex items-center justify-center text-pinkAccent shadow-inner">
          <i class="fa-solid fa-heart animate-pulse"></i>
        </div>
        <div>
          <h1 class="text-xs font-bold text-darkText tracking-tight">小年和小年对象</h1>
          <p class="text-[9px] text-subText" id="syncStatusText">☁️ 实时云端同步中 ✨</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 text-xs text-subText bg-pinkWarm/50 px-2.5 py-1 rounded-full font-bold text-pinkAccent">
        <i class="fa-solid fa-shield-heart text-[10px]"></i> 专属恋爱空间
      </div>
    </header>

    <!-- 底部/顶部通用导航 (对应图中的 首页、日常、纪念日、心愿、回忆) -->
    <nav class="glass-card grid grid-cols-5 p-2 sticky top-16 z-30 shadow-sm">
      <button onclick="switchTab('home')" id="nav-home" class="nav-btn active">
        <i class="fa-solid fa-house text-sm mb-0.5"></i>首页
      </button>
      <button onclick="switchTab('daily')" id="nav-daily" class="nav-btn">
        <i class="fa-solid fa-book-open text-sm mb-0.5"></i>日常
      </button>
      <button onclick="switchTab('anniversary')" id="nav-anniversary" class="nav-btn">
        <i class="fa-solid fa-calendar-days text-sm mb-0.5"></i>纪念日
      </button>
      <button onclick="switchTab('wishes')" id="nav-wishes" class="nav-btn">
        <i class="fa-solid fa-star text-sm mb-0.5"></i>心愿
      </button>
      <button onclick="switchTab('albums')" id="nav-albums" class="nav-btn">
        <i class="fa-solid fa-images text-sm mb-0.5"></i>回忆
      </button>
    </nav>

    <!-- ================= TAB 1: 首页 (生活里的每一个小喜欢) ================= -->
    <main id="page-home" class="space-y-4">
      <section class="glass-card p-5 text-center relative overflow-hidden bg-gradient-to-b from-pinkWarm/30 to-transparent">
        <div class="text-[10px] tracking-widest text-subText uppercase mb-1">OUR LOVE STORY</div>
        <h2 class="text-base font-bold text-darkText mb-3">把陪伴，放进每天的小里。</h2>

        <div class="flex items-center justify-center gap-5 my-2">
          <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-pinkWarm p-1 border-2 border-white shadow-sm mx-auto mb-1 flex items-center justify-center text-xl">👦🏻</div>
            <span class="text-xs font-bold text-darkText">小年</span>
          </div>
          <div class="text-center cursor-pointer" onclick="switchTab('anniversary')">
            <div class="text-3xl font-extrabold text-pinkAccent tracking-tight flex items-baseline justify-center">
              <span id="home-days">1</span>
              <span class="text-xs font-normal ml-1 text-subText">天</span>
            </div>
            <div class="text-[9px] text-pinkAccent bg-pinkWarm px-2.5 py-0.5 rounded-full mt-1 inline-block">相爱天数</div>
          </div>
          <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-yellowWarm p-1 border-2 border-white shadow-sm mx-auto mb-1 flex items-center justify-center text-xl">👧🏻</div>
            <span class="text-xs font-bold text-darkText">小年对象</span>
          </div>
        </div>
      </section>

      <!-- 6大功能模块入口 (复刻图片底部网格) -->
      <section class="grid grid-cols-2 gap-3">
        <div onclick="switchTab('daily')" class="glass-card p-4 hover:bg-pinkWarm/20 transition cursor-pointer flex flex-col justify-between">
          <div class="w-9 h-9 rounded-2xl bg-pinkWarm text-pinkAccent flex items-center justify-center mb-2 text-base"><i class="fa-solid fa-cloud"></i></div>
          <div>
            <h3 class="text-xs font-bold text-darkText">心情日记</h3>
            <p class="text-[10px] text-subText mt-0.5">给今天的情绪一个小角落</p>
          </div>
        </div>

        <div onclick="switchTab('anniversary')" class="glass-card p-4 hover:bg-yellowWarm/25 transition cursor-pointer flex flex-col justify-between">
          <div class="w-9 h-9 rounded-2xl bg-yellowWarm text-amber-600 flex items-center justify-center mb-2 text-base"><i class="fa-solid fa-calendar-check"></i></div>
          <div>
            <h3 class="text-xs font-bold text-darkText">纪念日</h3>
            <p class="text-[10px] text-subText mt-0.5">重要的日子，都认真记住</p>
          </div>
        </div>

        <div onclick="switchTab('wishes')" class="glass-card p-4 hover:bg-purpleWarm/25 transition cursor-pointer flex flex-col justify-between">
          <div class="w-9 h-9 rounded-2xl bg-purpleWarm text-purple-500 flex items-center justify-center mb-2 text-base"><i class="fa-solid fa-envelope-heart"></i></div>
          <div>
            <h3 class="text-xs font-bold text-darkText">情悄话小纸条</h3>
            <p class="text-[10px] text-subText mt-0.5">想说的话，慢慢告诉你</p>
          </div>
        </div>

        <div onclick="switchTab('albums')" class="glass-card p-4 hover:bg-greenWarm/25 transition cursor-pointer flex flex-col justify-between">
          <div class="w-9 h-9 rounded-2xl bg-greenWarm text-emerald-600 flex items-center justify-center mb-2 text-base"><i class="fa-solid fa-images"></i></div>
          <div>
            <h3 class="text-xs font-bold text-darkText">我们的相册</h3>
            <p class="text-[10px] text-subText mt-0.5">上传照片，收藏喜欢的瞬间</p>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= TAB 2: 日常碎碎念 ================= -->
    <main id="page-daily" class="hidden space-y-4">
      <div class="glass-card p-4 flex justify-between items-center">
        <div>
          <span class="text-[9px] tracking-widest text-subText uppercase">OUR EVERYDAY</span>
          <h2 class="text-sm font-bold text-darkText">日常碎碎念</h2>
        </div>
        <button onclick="openModal('addDailyModal')" class="text-xs bg-pinkAccent text-white px-3.5 py-1.5 rounded-full font-bold shadow-sm hover:bg-pinkHover transition">
          <i class="fa-solid fa-plus text-[10px] mr-1"></i>写一篇日常
        </button>
      </div>
      <div id="daily-container" class="space-y-3"></div>
    </main>

    <!-- ================= TAB 3: 纪念日 ================= -->
    <main id="page-anniversary" class="hidden space-y-4">
      <div class="glass-card p-4 flex justify-between items-center">
        <div>
          <span class="text-[9px] tracking-widest text-subText uppercase">OUR SPECIAL DAYS</span>
          <h2 class="text-sm font-bold text-darkText">我们的纪念日</h2>
        </div>
        <button onclick="openModal('addAnniversaryModal')" class="text-xs bg-pinkWarm text-pinkAccent px-3.5 py-1.5 rounded-full font-bold">
          + 添加纪念日
        </button>
      </div>
      <div id="anniversary-container" class="space-y-3"></div>
    </main>

    <!-- ================= TAB 4: 心愿单 ================= -->
    <main id="page-wishes" class="hidden space-y-4">
      <div class="glass-card p-4 flex justify-between items-center">
        <div>
          <span class="text-[9px] tracking-widest text-subText uppercase">OUR WISHES</span>
          <h2 class="text-sm font-bold text-darkText">一起完成的事</h2>
        </div>
        <button onclick="openModal('addWishModal')" class="text-xs bg-pinkAccent text-white px-3.5 py-1.5 rounded-full font-bold">
          + 添加心愿
        </button>
      </div>
      <div id="wishes-container" class="space-y-2.5"></div>
    </main>

    <!-- ================= TAB 5: 回忆/相册 ================= -->
    <main id="page-albums" class="hidden space-y-4">
      <div class="glass-card p-4 flex justify-between items-center">
        <div>
          <span class="text-[9px] tracking-widest text-subText uppercase">OUR MEMORY BOX</span>
          <h2 class="text-sm font-bold text-darkText">我们的相册</h2>
        </div>
        <button onclick="triggerAlbumUpload()" class="text-xs bg-pinkAccent text-white px-3.5 py-1.5 rounded-full font-bold shadow-sm">
          <i class="fa-solid fa-cloud-arrow-up text-[10px] mr-1"></i>上传照片
        </button>
        <input type="file" id="album-file-input" multiple accept="image/*" class="hidden" onchange="handleAlbumUpload(event)">
      </div>
      <div id="albums-grid" class="grid grid-cols-2 gap-3"></div>
    </main>

  </div>

  <!-- MODALS (弹窗组件) -->
  <div id="addDailyModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-2xl">
      <h3 class="text-sm font-bold text-darkText">写一篇日常</h3>
      <textarea id="dailyInput" rows="4" placeholder="大小事，想和你说分亨的都是好事..." class="w-full p-3 bg-gray-50 border rounded-2xl text-xs outline-none focus:border-pinkAccent"></textarea>
      <div class="flex gap-2"><button onclick="closeModal('addDailyModal')" class="flex-1 py-2 bg-gray-100 rounded-xl text-xs font-bold">取消</button><button onclick="saveDaily()" class="flex-1 py-2 bg-pinkAccent text-white rounded-xl text-xs font-bold">发布</button></div>
    </div>
  </div>

  <div id="addAnniversaryModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-2xl">
      <h3 class="text-sm font-bold text-darkText">添加纪念日</h3>
      <input type="text" id="annivTitle" placeholder="纪念日名称 (如: 故事开始的第一天)" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs">
      <input type="date" id="annivDate" class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs">
      <div class="flex gap-2"><button onclick="closeModal('addAnniversaryModal')" class="flex-1 py-2 bg-gray-100 rounded-xl text-xs font-bold">取消</button><button onclick="saveAnniversary()" class="flex-1 py-2 bg-pinkAccent text-white rounded-xl text-xs font-bold">保存</button></div>
    </div>
  </div>

  <div id="addWishModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-2xl">
      <h3 class="text-sm font-bold text-darkText">添加想一起做的事</h3>
      <input type="text" id="wishTitle" placeholder="如: 一起看海、一起散步..." class="w-full p-2.5 bg-gray-50 border rounded-xl text-xs">
      <div class="flex gap-2"><button onclick="closeModal('addWishModal')" class="flex-1 py-2 bg-gray-100 rounded-xl text-xs font-bold">取消</button><button onclick="saveWish()" class="flex-1 py-2 bg-pinkAccent text-white rounded-xl text-xs font-bold">添加</button></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-darkText/90 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <script>
    /* ================= FIREBASE CLOUD SYNC & APP LOGIC ================= */
    const firebaseConfig = { databaseURL: "https://feifei-guaiguai-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('loveSiteStore_xiaonian');

    let store = {
      startDate: '2025-07-30',
      dailies: [],
      anniversaries: [
        { id: 1, title: '故事开始的那一天', date: '2025-07-30' }
      ],
      wishes: [],
      photos: []
    };

    let isRemoteUpdate = false;

    // 本地缓存兜底
    const localCached = localStorage.getItem('xiaonianLoveLocal');
    if (localCached) {
      try { store = JSON.parse(localCached); renderAll(); } catch(e) {}
    }

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        store = data;
        isRemoteUpdate = true;
        renderAll();
        isRemoteUpdate = false;
        localStorage.setItem('xiaonianLoveLocal', JSON.stringify(store));
        document.getElementById('syncStatusText').innerText = '☁️ 双人云端同步中 ✨';
      } else {
        saveData();
      }
    }, () => {
      document.getElementById('syncStatusText').innerText = '⚠️ 离线本地模式';
    });

    function saveData() {
      if (isRemoteUpdate) return;
      localStorage.setItem('xiaonianLoveLocal', JSON.stringify(store));
      renderAll();
      dbRef.set(store).catch(() => {});
    }

    function renderAll() {
      // 计算相爱天数
      const start = new Date(store.startDate || '2025-07-30');
      const today = new Date();
      const days = Math.max(1, Math.ceil(Math.abs(today - start) / (1000 * 60 * 60 * 24)));
      document.getElementById('home-days').innerText = days;

      // 渲染日常
      document.getElementById('daily-container').innerHTML = (store.dailies || []).map(d => `
        <div class="glass-card p-4 space-y-1.5">
          <p class="text-xs text-darkText font-medium whitespace-pre-wrap">${d.text}</p>
          <div class="flex justify-between items-center text-[9px] text-subText pt-1 border-t border-gray-100">
            <span>${d.time}</span>
            <button onclick="deleteDaily(${d.id})" class="text-gray-300 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('') || '<div class="glass-card p-8 text-center text-xs text-subText">我们的第一篇日常，等你来写~</div>';

      // 渲染纪念日
      document.getElementById('anniversary-container').innerHTML = (store.anniversaries || []).map(a => {
        const diff = Math.ceil((new Date(a.date) - new Date()) / (1000 * 60 * 60 * 24));
        return `
          <div class="glass-card p-4 flex justify-between items-center">
            <div>
              <div class="text-xs font-bold text-darkText">${a.title}</div>
              <div class="text-[10px] text-subText mt-0.5">${a.date}</div>
            </div>
            <div class="text-right">
              <span class="text-sm font-extrabold text-pinkAccent">${Math.abs(diff)} 天</span>
              <div class="text-[9px] text-subText">${diff >= 0 ? '距这一天还有' : '已经过去'}</div>
            </div>
          </div>
        `;
      }).join('');

      // 渲染心愿
      document.getElementById('wishes-container').innerHTML = (store.wishes || []).map(w => `
        <div class="glass-card p-3 flex justify-between items-center">
          <span onclick="toggleWish(${w.id})" class="text-xs cursor-pointer ${w.done ? 'line-through text-subText' : 'text-darkText font-medium'}">
            ${w.done ? '✨' : '⭐'} ${w.text}
          </span>
          <button onclick="deleteWish(${w.id})" class="text-gray-300 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('') || '<div class="glass-card p-6 text-center text-xs text-subText">好想和你，一起做好多事...</div>';

      // 渲染相册
      document.getElementById('albums-grid').innerHTML = (store.photos || []).map(p => `
        <div class="glass-card p-2 relative group">
          <div class="h-32 rounded-xl overflow-hidden bg-gray-100 mb-1">
            <img src="${p.url}" class="w-full h-full object-cover">
          </div>
          <button onclick="deletePhoto('${p.id}')" class="absolute top-3 right-3 bg-black/50 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('') || '<div class="col-span-2 glass-card p-8 text-center text-xs text-subText">相册空空如也，点击上方上传回忆照片 📷</div>';
    }

    function switchTab(tabId) {
      document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
      document.getElementById(`page-${tabId}`).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`nav-${tabId}`).classList.add('active');
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.remove('opacity-0');
      setTimeout(() => t.classList.add('opacity-0'), 2000);
    }

    function saveDaily() {
      const text = document.getElementById('dailyInput').value.trim();
      if (text) {
        if (!store.dailies) store.dailies = [];
        const now = new Date();
        store.dailies.unshift({ id: Date.now(), text, time: `${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}` });
        document.getElementById('dailyInput').value = '';
        closeModal('addDailyModal'); saveData(); showToast('💌 日常发布成功！');
      }
    }
    function deleteDaily(id) { store.dailies = store.dailies.filter(d => d.id !== id); saveData(); }

    function saveAnniversary() {
      const title = document.getElementById('annivTitle').value.trim();
      const date = document.getElementById('annivDate').value;
      if (title && date) {
        if (!store.anniversaries) store.anniversaries = [];
        store.anniversaries.push({ id: Date.now(), title, date });
        closeModal('addAnniversaryModal'); saveData(); showToast('✨ 纪念日添加成功！');
      }
    }

    function saveWish() {
      const text = document.getElementById('wishTitle').value.trim();
      if (text) {
        if (!store.wishes) store.wishes = [];
        store.wishes.unshift({ id: Date.now(), text, done: false });
        document.getElementById('wishTitle').value = '';
        closeModal('addWishModal'); saveData(); showToast('⭐ 心愿添加成功！');
      }
    }
    function toggleWish(id) { store.wishes = store.wishes.map(w => w.id === id ? { ...w, done: !w.done } : w); saveData(); }
    function deleteWish(id) { store.wishes = store.wishes.filter(w => w.id !== id); saveData(); }

    function triggerAlbumUpload() { document.getElementById('album-file-input').click(); }
    function handleAlbumUpload(e) {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      showToast(`⏳ 正在压缩并保存 ${files.length} 张照片...`);
      
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > 900) { h = Math.round((900 * h) / w); w = 900; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            
            if (!store.photos) store.photos = [];
            store.photos.unshift({ id: 'photo-' + Date.now() + Math.random(), url: canvas.toDataURL('image/jpeg', 0.8) });
            saveData();
            showToast('🎉 照片上传成功！');
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }
    function deletePhoto(id) { store.photos = store.photos.filter(p => p.id !== id); saveData(); showToast('🗑️ 照片已删除'); }
  </script>
</body>
</html>
